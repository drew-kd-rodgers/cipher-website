<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesar Cipher Encoder/Decoder</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex flex-col bg-zinc-200 pt-16">
    <main class="mx-auto container grid md:grid-cols-2 md:max-w-3/5 md:max-h-3/4 gap-10">
        <div>
            <label for="plaintext" class="text-zinc-500">PLAINTEXT</label><br>
            <textarea id="plaintext" name="plaintext" class="p-2 rounded-sm ring-2 ring-zinc-300 bg-white h-full w-full text-zinc-800"></textarea>
        </div>
        <div>
            <label for="ciphertext" class="text-zinc-500">CIPHERTEXT</label><br>
            <textarea id="ciphertext" name="plaintext" class="p-2 rounded-sm ring-2 ring-zinc-300 bg-white h-full w-full text-zinc-800"></textarea>
        </div>
    </main>
</body>
